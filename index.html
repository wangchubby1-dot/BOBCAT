<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PAIR MATRIX (Browser Minigame)</title>
  <style>
    :root{
      --bg:#0b1320;
      --panel:#0f2238;
      --tile:#112a45;
      --tile2:#0d1f34;
      --line:#1a3f66;
      --glow:#4dffb5;
      --text:#cfe7ff;
      --muted:#7aa7d6;
      --danger:#ff5d5d;
      --ok:#45ff9a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #102746 0%, var(--bg) 55%, #070c14 100%);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    .wrap{
      width:min(92vw, 720px);
      padding:18px;
    }
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border:1px solid rgba(77,255,181,0.22);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 20px 60px rgba(0,0,0,0.45);
      border-radius:16px;
      overflow:hidden;
    }
    .topbar{
      padding:14px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: rgba(0,0,0,0.25);
      border-bottom:1px solid rgba(77,255,181,0.18);
    }
    .title{
      display:flex;
      gap:10px;
      align-items:baseline;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:700;
      color:var(--glow);
      text-shadow: 0 0 14px rgba(77,255,181,0.35);
      font-size:14px;
    }
    .title span{
      color:var(--muted);
      font-weight:600;
      letter-spacing:.08em;
      text-transform:none;
      font-size:12px;
    }
    .stats{
      display:flex;
      gap:14px;
      align-items:center;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .stat b{color:var(--text); font-weight:700}
    .timer{
      height:8px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(77,255,181,0.18);
      border-radius:999px;
      overflow:hidden;
      margin:12px 16px 14px;
      position:relative;
    }
    .timer > .fill{
      height:100%;
      width:100%;
      background: linear-gradient(90deg, rgba(77,255,181,0.25), rgba(77,255,181,0.95));
      box-shadow: 0 0 18px rgba(77,255,181,0.35);
      transform-origin:left center;
      transform: scaleX(1);
      transition: transform .08s linear;
    }
    .content{
      padding: 10px 16px 16px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      padding: 8px;
      background: rgba(0,0,0,0.22);
      border:1px solid rgba(77,255,181,0.14);
      border-radius:14px;
    }
    .tile{
      aspect-ratio:1/1;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1px solid rgba(122,167,214,0.22);
      display:grid;
      place-items:center;
      position:relative;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
      overflow:hidden;
    }
    .tile:active{ transform: scale(0.98); }
    .tile::after{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:10px;
      background: rgba(13,31,52,0.6);
      border:1px solid rgba(26,63,102,0.6);
      opacity:.6;
    }
    .tile .dot{
      width:6px;height:6px;border-radius:99px;
      background: rgba(77,255,181,0.7);
      box-shadow: 0 0 10px rgba(77,255,181,0.35);
      z-index:2;
      opacity:.9;
    }
    .tile.revealed::after{ opacity:.28; }
    .tile.revealed .dot{ opacity:.15; }
    .tile .sym{
      z-index:3;
      font-size:34px;
      color: var(--glow);
      text-shadow: 0 0 16px rgba(77,255,181,0.25);
      opacity:0;
      transform: translateY(4px) scale(.98);
      transition: opacity .12s ease, transform .12s ease;
    }
    .tile.revealed .sym{
      opacity:1;
      transform: translateY(0) scale(1);
    }
    .tile.matched{
      border-color: rgba(69,255,154,0.7);
      box-shadow: 0 0 0 2px rgba(69,255,154,0.15), 0 0 24px rgba(69,255,154,0.14);
    }
    .tile.cursor{
      border-color: rgba(77,255,181,0.85);
      box-shadow: 0 0 0 2px rgba(77,255,181,0.14), 0 0 26px rgba(77,255,181,0.16);
      background: linear-gradient(180deg, rgba(77,255,181,0.13), rgba(255,255,255,0.02));
    }
    .bottom{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top:4px;
    }
    .help{
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .btns{
      display:flex;
      gap:8px;
      align-items:center;
    }
    button{
      appearance:none;
      border:none;
      background: rgba(77,255,181,0.14);
      color: var(--text);
      border:1px solid rgba(77,255,181,0.28);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.02em;
    }
    button:hover{ background: rgba(77,255,181,0.18); }
    button:active{ transform: translateY(1px); }
    .toggle{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
      user-select:none;
    }
    .toggle input{ transform: translateY(1px); }
    .overlay{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background: rgba(0,0,0,0.55);
      padding:16px;
    }
    .overlay.show{ display:grid; }
    .modal{
      width:min(92vw, 520px);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(15,34,56,0.98), rgba(10,20,34,0.98));
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .badge{
      width:28px;height:28px;border-radius:10px;
      display:grid; place-items:center;
      background: rgba(255,93,93,0.12);
      border:1px solid rgba(255,93,93,0.35);
      color:var(--danger);
      font-weight:900;
    }
    .modalHead .h{
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .modalBody{
      padding:14px 16px 16px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }
    .modalBody b{ color: var(--text); }
    .modalActions{
      padding: 0 16px 16px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
  </style>
