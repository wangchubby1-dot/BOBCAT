<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PAIR MATRIX (Browser Minigame)</title>
  <style>
    :root{
      --bg:#0b1320;
      --panel:#0f2238;
      --tile:#112a45;
      --tile2:#0d1f34;
      --line:#1a3f66;
      --glow:#4dffb5;
      --text:#cfe7ff;
      --muted:#7aa7d6;
      --danger:#ff5d5d;
      --ok:#45ff9a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #102746 0%, var(--bg) 55%, #070c14 100%);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    .wrap{
      width:min(92vw, 720px);
      padding:18px;
    }
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border:1px solid rgba(77,255,181,0.22);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 20px 60px rgba(0,0,0,0.45);
      border-radius:16px;
      overflow:hidden;
    }
    .topbar{
      padding:14px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: rgba(0,0,0,0.25);
      border-bottom:1px solid rgba(77,255,181,0.18);
    }
    .title{
      display:flex;
      gap:10px;
      align-items:baseline;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:700;
      color:var(--glow);
      text-shadow: 0 0 14px rgba(77,255,181,0.35);
      font-size:14px;
    }
    .title span{
      color:var(--muted);
      font-weight:600;
      letter-spacing:.08em;
      text-transform:none;
      font-size:12px;
    }
    .stats{
      display:flex;
      gap:14px;
      align-items:center;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .stat b{color:var(--text); font-weight:700}
    .timer{
      height:8px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(77,255,181,0.18);
      border-radius:999px;
      overflow:hidden;
      margin:12px 16px 14px;
      position:relative;
    }
    .timer > .fill{
      height:100%;
      width:100%;
      background: linear-gradient(90deg, rgba(77,255,181,0.25), rgba(77,255,181,0.95));
      box-shadow: 0 0 18px rgba(77,255,181,0.35);
      transform-origin:left center;
      transform: scaleX(1);
      transition: transform .08s linear;
    }
    .content{
      padding: 10px 16px 16px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      padding: 8px;
      background: rgba(0,0,0,0.22);
      border:1px solid rgba(77,255,181,0.14);
      border-radius:14px;
    }
    .tile{
      aspect-ratio:1/1;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1px solid rgba(122,167,214,0.22);
      display:grid;
      place-items:center;
      position:relative;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
      overflow:hidden;
    }
    .tile:active{ transform: scale(0.98); }
    .tile::after{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:10px;
      background: rgba(13,31,52,0.6);
      border:1px solid rgba(26,63,102,0.6);
      opacity:.6;
    }
    .tile .dot{
      width:6px;height:6px;border-radius:99px;
      background: rgba(77,255,181,0.7);
      box-shadow: 0 0 10px rgba(77,255,181,0.35);
      z-index:2;
      opacity:.9;
    }
    .tile.revealed::after{ opacity:.28; }
    .tile.revealed .dot{ opacity:.15; }
    .tile .sym{
      z-index:3;
      font-size:34px;
      color: var(--glow);
      text-shadow: 0 0 16px rgba(77,255,181,0.25);
      opacity:0;
      transform: translateY(4px) scale(.98);
      transition: opacity .12s ease, transform .12s ease;
    }
    .tile.revealed .sym{
      opacity:1;
      transform: translateY(0) scale(1);
    }
    .tile.matched{
      border-color: rgba(69,255,154,0.7);
      box-shadow: 0 0 0 2px rgba(69,255,154,0.15), 0 0 24px rgba(69,255,154,0.14);
    }
    .tile.cursor{
      border-color: rgba(77,255,181,0.85);
      box-shadow: 0 0 0 2px rgba(77,255,181,0.14), 0 0 26px rgba(77,255,181,0.16);
      background: linear-gradient(180deg, rgba(77,255,181,0.13), rgba(255,255,255,0.02));
    }
    .bottom{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top:4px;
    }
    .help{
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .btns{
      display:flex;
      gap:8px;
      align-items:center;
    }
    button{
      appearance:none;
      border:none;
      background: rgba(77,255,181,0.14);
      color: var(--text);
      border:1px solid rgba(77,255,181,0.28);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.02em;
    }
    button:hover{ background: rgba(77,255,181,0.18); }
    button:active{ transform: translateY(1px); }
    .toggle{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
      user-select:none;
    }
    .toggle input{ transform: translateY(1px); }
    .overlay{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background: rgba(0,0,0,0.55);
      padding:16px;
    }
    .overlay.show{ display:grid; }
    .modal{
      width:min(92vw, 520px);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(15,34,56,0.98), rgba(10,20,34,0.98));
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .badge{
      width:28px;height:28px;border-radius:10px;
      display:grid; place-items:center;
      background: rgba(255,93,93,0.12);
      border:1px solid rgba(255,93,93,0.35);
      color:var(--danger);
      font-weight:900;
    }
    .modalHead .h{
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .modalBody{
      padding:14px 16px 16px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }
    .modalBody b{ color: var(--text); }
    .modalActions{
      padding: 0 16px 16px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar">
        <div class="title">› _ PAIR MATRIX <span>auth sequence</span></div>
        <div class="stats">
          <div class="stat">TIME <b id="timeLeft">30.0</b>s</div>
          <div class="stat">MATCHED <b id="matched">0</b>/8</div>
          <div class="stat">MOVES <b id="moves">0</b></div>
        </div>
      </div>

      <div class="timer" aria-label="timer bar"><div class="fill" id="timerFill"></div></div>

      <div class="content">
        <div class="grid" id="grid" role="grid" aria-label="Pair matrix grid"></div>

        <div class="bottom">
          <div class="help">
            Controls: <b>Arrow Keys</b> move • <b>Enter/Space</b> flip • Click/Tap tile<br/>
            Match all symbols before time runs out to authenticate.
          </div>

          <div class="btns">
            <label class="toggle">
              <input type="checkbox" id="soundToggle" checked />
              Sound FX
            </label>
            <button id="restartBtn" type="button">Restart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Access denied / win overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHead">
        <div class="badge" id="badge">!</div>
        <div>
          <div class="h" id="modalTitle">ACCESS DENIED</div>
          <div style="color:rgba(255,255,255,0.65);font-size:12px;margin-top:2px" id="modalSub">
            Error: authentication failed.
          </div>
        </div>
      </div>
      <div class="modalBody" id="modalBody">
        Trace: timed out during handshake. Retry the sequence.
      </div>
      <div class="modalActions">
        <button id="closeBtn" type="button">Try Again</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // ---- Audio (WebAudio, no files) ----
  const AudioFX = (() => {
    let ctx = null;
    const getCtx = () => {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx;
    };

    const state = { enabled: true };

    function tone({freq=440, dur=0.08, type="sine", gain=0.06, sweepTo=null}) {
      if (!state.enabled) return;
      const ac = getCtx();
      const t0 = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      o.connect(g).connect(ac.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    }

    function noisePop(dur=0.06, gain=0.03) {
      if (!state.enabled) return;
      const ac = getCtx();
      const t0 = ac.currentTime;
      const bufferSize = Math.floor(ac.sampleRate * dur);
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);

      const src = ac.createBufferSource();
      src.buffer = buffer;

      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);

      // Slightly band-limit
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.setValueAtTime(1200, t0);
      bp.Q.setValueAtTime(0.9, t0);

      src.connect(bp).connect(g).connect(ac.destination);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    }

    const api = {
      state,
      click() { tone({freq:520, dur:0.05, type:"square", gain:0.04}); },
      flip()  { tone({freq:420, dur:0.07, type:"triangle", gain:0.05, sweepTo:780}); },
      match() { tone({freq:660, dur:0.08, type:"sine", gain:0.06}); tone({freq:990, dur:0.10, type:"sine", gain:0.05}); },
      miss()  { tone({freq:220, dur:0.12, type:"sawtooth", gain:0.05, sweepTo:140}); noisePop(0.05, 0.02); },
      win()   {
        tone({freq:523.25, dur:0.10, type:"sine", gain:0.06});
        tone({freq:659.25, dur:0.10, type:"sine", gain:0.06});
        tone({freq:783.99, dur:0.14, type:"sine", gain:0.06});
      },
      lose()  {
        tone({freq:330, dur:0.12, type:"sawtooth", gain:0.05, sweepTo:196});
        tone({freq:196, dur:0.16, type:"sawtooth", gain:0.05, sweepTo:110});
      },
      ensureUnlocked() {
        // Safari/iOS requires a user gesture; calling resume on interaction helps.
        try { getCtx().resume(); } catch {}
      }
    };
    return api;
  })();

  // ---- Game ----
  const gridEl = document.getElementById("grid");
  const matchedEl = document.getElementById("matched");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("timeLeft");
  const timerFill = document.getElementById("timerFill");
  const restartBtn = document.getElementById("restartBtn");
  const overlay = document.getElementById("overlay");
  const closeBtn = document.getElementById("closeBtn");
  const modalTitle = document.getElementById("modalTitle");
  const modalSub = document.getElementById("modalSub");
  const modalBody = document.getElementById("modalBody");
  const badge = document.getElementById("badge");
  const soundToggle = document.getElementById("soundToggle");

  const SYMBOLS = ["⌬","⌁","⌖","⌘","⎈","⏣","⟐","⟡"]; // 8 symbols, 2 of each => 16
  const GRID = 4;
  const TOTAL_PAIRS = 8;
  const ROUND_TIME = 30.0; // seconds (close to your clip vibe)

  let tiles = [];
  let cursor = 0;
  let firstPick = null;
  let lock = false;
  let moves = 0;
  let matched = 0;

  let startTime = 0;
  let raf = 0;
  let ended = false;

  function shuffle(arr){
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function buildTiles(){
    const pool = shuffle([...SYMBOLS, ...SYMBOLS]); // 16
    tiles = pool.map((sym, idx) => ({
      id: idx,
      sym,
      revealed: false,
      matched: false
    }));
  }

  function render(){
    gridEl.innerHTML = "";
    tiles.forEach((t, idx) => {
      const btn = document.createElement("div");
      btn.className = "tile";
      btn.setAttribute("role", "gridcell");
      btn.setAttribute("tabindex", "-1");
      btn.dataset.idx = String(idx);

      if (t.revealed) btn.classList.add("revealed");
      if (t.matched) btn.classList.add("matched");
      if (idx === cursor) btn.classList.add("cursor");

      const dot = document.createElement("div");
      dot.className = "dot";

      const sym = document.createElement("div");
      sym.className = "sym";
      sym.textContent = t.sym;

      btn.appendChild(dot);
      btn.appendChild(sym);

      btn.addEventListener("pointerdown", () => {
        AudioFX.ensureUnlocked();
        cursor = idx;
        AudioFX.click();
        syncCursorClasses();
        flipAt(idx);
      });

      gridEl.appendChild(btn);
    });

    matchedEl.textContent = String(matched);
    movesEl.textContent = String(moves);
  }

  function syncCursorClasses(){
    [...gridEl.children].forEach((el, idx) => {
      el.classList.toggle("cursor", idx === cursor);
    });
  }

  function setOverlay(show){
    overlay.classList.toggle("show", show);
    overlay.setAttribute("aria-hidden", String(!show));
  }

  function endGame(win){
    ended = true;
    cancelAnimationFrame(raf);

    if (win){
      AudioFX.win();
      badge.textContent = "✓";
      badge.style.color = "var(--ok)";
      badge.style.borderColor = "rgba(69,255,154,0.45)";
      badge.style.background = "rgba(69,255,154,0.12)";
      modalTitle.textContent = "ACCESS GRANTED";
      modalSub.textContent = "Handshake complete.";
      modalBody.innerHTML = `Status: <b>authenticated</b>.<br/>Moves: <b>${moves}</b> • Time left: <b>${timeEl.textContent}s</b>`;
    } else {
      AudioFX.lose();
      badge.textContent = "!";
      badge.style.color = "var(--danger)";
      badge.style.borderColor = "rgba(255,93,93,0.35)";
      badge.style.background = "rgba(255,93,93,0.12)";
      modalTitle.textContent = "ACCESS DENIED";
      modalSub.textContent = "Error: authentication failed.";
      modalBody.innerHTML = `Trace: sequence incomplete.<br/>Matched: <b>${matched}/${TOTAL_PAIRS}</b> • Moves: <b>${moves}</b>`;
    }
    setOverlay(true);
  }

  function flipAt(idx){
    if (ended || lock) return;
    const t = tiles[idx];
    if (t.matched || t.revealed) return;

    // reveal
    t.revealed = true;
    AudioFX.flip();
    render();

    if (firstPick === null){
      firstPick = idx;
      return;
    }

    moves++;
    const a = tiles[firstPick];
    const b = tiles[idx];

    if (a.sym === b.sym){
      // match
      a.matched = true;
      b.matched = true;
      matched++;
      firstPick = null;
      AudioFX.match();
      render();
      if (matched >= TOTAL_PAIRS) endGame(true);
    } else {
      // mismatch
      lock = true;
      AudioFX.miss();
      setTimeout(() => {
        a.revealed = false;
        b.revealed = false;
        firstPick = null;
        lock = false;
        render();
      }, 520);
    }
    matchedEl.textContent = String(matched);
    movesEl.textContent = String(moves);
  }

  function clampCursor(){
    cursor = Math.max(0, Math.min(tiles.length - 1, cursor));
    syncCursorClasses();
  }

  function moveCursor(dx, dy){
    const x = cursor % GRID;
    const y = Math.floor(cursor / GRID);
    const nx = Math.max(0, Math.min(GRID-1, x + dx));
    const ny = Math.max(0, Math.min(GRID-1, y + dy));
    cursor = ny * GRID + nx;
    AudioFX.click();
    clampCursor();
  }

  function tick(){
    const now = performance.now();
    const elapsed = (now - startTime) / 1000;
    const left = Math.max(0, ROUND_TIME - elapsed);

    timeEl.textContent = left.toFixed(1);
    timerFill.style.transform = `scaleX(${left / ROUND_TIME})`;

    // Make the bar look more urgent near the end by slightly dimming
    if (left < 6) timerFill.style.filter = "saturate(1.2) brightness(0.95)";
    else timerFill.style.filter = "none";

    if (left <= 0 && !ended){
      endGame(false);
      return;
    }

    raf = requestAnimationFrame(tick);
  }

  function restart(){
    ended = false;
    setOverlay(false);
    moves = 0;
    matched = 0;
    firstPick = null;
    lock = false;
    cursor = 0;
    buildTiles();
    render();
    startTime = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  // Keyboard
  window.addEventListener("keydown", (e) => {
    // unlock audio on first key action
    AudioFX.ensureUnlocked();

    if (overlay.classList.contains("show")){
      if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
        e.preventDefault();
        restart();
      }
      return;
    }

    const k = e.key;
    if (k === "ArrowLeft"){ e.preventDefault(); moveCursor(-1,0); }
    else if (k === "ArrowRight"){ e.preventDefault(); moveCursor(1,0); }
    else if (k === "ArrowUp"){ e.preventDefault(); moveCursor(0,-1); }
    else if (k === "ArrowDown"){ e.preventDefault(); moveCursor(0,1); }
    else if (k === "Enter" || k === " "){
      e.preventDefault();
      flipAt(cursor);
    }
  });

  // UI buttons
  restartBtn.addEventListener("click", () => { AudioFX.ensureUnlocked(); AudioFX.click(); restart(); });
  closeBtn.addEventListener("click", () => { AudioFX.ensureUnlocked(); AudioFX.click(); restart(); });

  soundToggle.addEventListener("change", () => {
    AudioFX.state.enabled = soundToggle.checked;
    AudioFX.ensureUnlocked();
    if (AudioFX.state.enabled) AudioFX.match();
  });

  // Start
  restart();
})();
</script>
</body>
</html>
